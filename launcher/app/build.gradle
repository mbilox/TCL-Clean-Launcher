plugins {
    id 'com.android.application'
}

// Release signing: launcher/keystore.properties (gitignored) points at a keystore kept OUTSIDE this
// repo. Without that file the release build falls back to the debug key, like upstream.
def keystorePropsFile = new File(rootDir, 'keystore.properties')
def keystoreProps = new Properties()
def hasReleaseKey = keystorePropsFile.exists()
if (hasReleaseKey) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace 'com.gathin.tvhome'
    compileSdk 34

    signingConfigs {
        if (hasReleaseKey) {
            release {
                storeFile new File(rootDir, keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    defaultConfig {
        // Opt-in identity for firmware with a package-name HOME allowlist; see docs/devices/xiaomi-mitv-aetp0-dofus.md.
        // TCL Clean Launcher ships its own identity, set in launcher/gradle.properties.
        applicationId providers.gradleProperty('launcherApplicationId').getOrElse('com.gathin.tvhome')
        minSdk 26
        targetSdk 34
        versionCode 9
        versionName '3.0'
        // TCL Clean Launcher targets LATAM only: dropping the other 24 locales saves ~165 KB of
        // the APK and ~160 KB of resources.arsc (measured on the real unit, docs/project/AUDIT.md).
        resourceConfigurations += ['en', 'es', 'pt']
    }

    buildTypes {
        release {
            // R8 strips and optimises the code (AndroidX included): smaller APK, faster start on a slow TV CPU.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Our own key when launcher/keystore.properties exists (it is gitignored and the keystore
            // lives outside the repo). Without it, fall back to the debug key like upstream does.
            signingConfig hasReleaseKey ? signingConfigs.release : signingConfigs.debug
        }
    }

    packagingOptions {
        resources {
            // Kotlin metadata pulled in by AndroidX's dependencies. This launcher is plain Java and never reads it;
            // leaving it out saves about 14 KB of every install.
            excludes += ['kotlin/**', 'META-INF/*.version', 'META-INF/*.kotlin_module', 'DebugProbesKt.bin']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    // Test only (never in the APK): plain JVM tests for the module card validators, src/test.
    testImplementation 'junit:junit:4.13.2'
}
